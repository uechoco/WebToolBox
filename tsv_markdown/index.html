<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Converter (CSV/TSV/Markdown/HTML/ASCII)</title>
    <!-- PapaParse for CSV/TSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --pane-bg: #fff;
            --border-color: #ddd;
            --accent-color: #007bff;
            --error-bg: #ffe6e6;
            --error-text: #d8000c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px 20px;
            background-color: var(--pane-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select,
        button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            cursor: pointer;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        button#swap-btn {
            font-size: 18px;
            padding: 4px 12px;
        }

        .main-container {
            flex: 1;
            display: flex;
            padding: 10px;
            gap: 10px;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--pane-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            position: relative;
        }

        .pane-header {
            padding: 8px;
            font-weight: bold;
            background-color: #f9f9f9;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: #666;
        }

        textarea {
            flex: 1;
            border: none;
            padding: 10px;
            resize: none;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            outline: none;
            white-space: pre;
        }

        .error-container {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px 20px;
            font-size: 14px;
            display: none;
            /* Hidden by default */
            border-top: 1px solid #ffb3b3;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            body {
                height: auto;
                min-height: 100vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Table Converter</h1>
        <div class="controls">
            <select id="left-format">
                <option value="csv">CSV</option>
                <option value="tsv" selected>TSV</option>
                <option value="markdown">Markdown</option>
                <option value="html">HTML</option>
                <option value="ascii">ASCII Art</option>
            </select>

            <button id="swap-btn" title="Swap Inputs">⇄</button>

            <select id="right-format">
                <option value="csv">CSV</option>
                <option value="tsv">TSV</option>
                <option value="markdown" selected>Markdown</option>
                <option value="html">HTML</option>
                <option value="ascii">ASCII Art</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="pane">
            <div class="pane-header">Input</div>
            <textarea id="left-pane" placeholder="Paste your data here..."></textarea>
        </div>
        <div class="pane">
            <div class="pane-header">Output</div>
            <textarea id="right-pane" readonly placeholder="Result will appear here..."></textarea>
        </div>
    </div>

    <div class="error-container" id="error-msg"></div>

    <script>
        const leftPane = document.getElementById('left-pane');
        const rightPane = document.getElementById('right-pane');
        const leftFormatSel = document.getElementById('left-format');
        const rightFormatSel = document.getElementById('right-format');
        const swapBtn = document.getElementById('swap-btn');
        const errorMsg = document.getElementById('error-msg');

        // Intermediate representation: array of arrays of strings
        // e.g. [['Header1', 'Header2'], ['Val1', 'Val2']]

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function clearError() {
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';
        }

        // --- Parsers ---

        function parseCSV(text) {
            const result = Papa.parse(text, { header: false, skipEmptyLines: false });
            if (result.errors.length > 0) {
                throw new Error(`CSV Parse Error: ${result.errors[0].message}`);
            }
            return result.data;
        }

        function parseTSV(text) {
            // PapaParse handles TSV if delimiter is tab
            const result = Papa.parse(text, { delimiter: "\t", header: false, skipEmptyLines: false });
            if (result.errors.length > 0) {
                throw new Error(`TSV Parse Error: ${result.errors[0].message}`);
            }
            return result.data;
        }

        function parseMarkdown(text) {
            const lines = text.trim().split('\n');
            const data = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                // Ignore separator lines (e.g. |---|---|)
                if (line.match(/^\|?\s*:?-+:?\s*(\| \s*:?-+:?\s*)*\|?$/)) {
                    continue;
                }

                // Remove leading/trailing pipes
                if (line.startsWith('|')) line = line.substring(1);
                if (line.endsWith('|')) line = line.substring(0, line.length - 1);

                const cells = line.split('|').map(c => c.trim());
                data.push(cells);
            }
            return data;
        }

        function parseHTML(text) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');
            const table = doc.querySelector('table');
            if (!table) throw new Error("No <table> tag found in input.");

            const data = [];
            const rows = table.querySelectorAll('tr');

            rows.forEach(row => {
                const rowData = [];
                const cells = row.querySelectorAll('td, th');
                cells.forEach(cell => rowData.push(cell.textContent.trim()));
                if (rowData.length > 0) data.push(rowData);
            });

            return data;
        }

        function parseASCII(text) {
            // Simple parser for MySQL style or Markdown style ASCII tables
            // +---+---+
            // | A | B |
            // +---+---+

            const lines = text.trim().split('\n');
            const data = [];

            for (let line of lines) {
                line = line.trim();
                // Skip separator lines (+---+ or |---| where inner content is only -)
                if (line.startsWith('+') || line.match(/^\|[-+ ]+\|$/)) {
                    continue;
                }

                // Remove side borders
                const content = line.replace(/^\||\|$/g, '');
                const cells = content.split('|').map(c => c.trim());
                data.push(cells);
            }
            return data;
        }

        function parse(text, format) {
            if (!text.trim()) return [];
            switch (format) {
                case 'csv': return parseCSV(text);
                case 'tsv': return parseTSV(text);
                case 'markdown': return parseMarkdown(text);
                case 'html': return parseHTML(text);
                case 'ascii': return parseASCII(text);
                default: throw new Error(`Unknown format: ${format}`);
            }
        }

        // --- Generators ---

        function generateCSV(data) {
            return Papa.unparse(data);
        }

        function generateTSV(data) {
            return Papa.unparse(data, { delimiter: "\t" });
        }

        function generateMarkdown(data) {
            if (data.length === 0) return "";

            // Calculate max width for each column
            const colWidths = [];
            const colCount = data.reduce((max, row) => Math.max(max, row.length), 0);

            for (let i = 0; i < colCount; i++) {
                colWidths[i] = 3; // Min width "---"
                for (let row of data) {
                    const cell = row[i] || "";
                    colWidths[i] = Math.max(colWidths[i], cell.length);
                }
            }

            let output = "";

            // Header
            const headerRow = data[0] || [];
            output += "| " + headerRow.map((c, i) => (c || "").padEnd(colWidths[i])).join(" | ") + " |\n";

            // Separator
            output += "| " + colWidths.map(w => "-".repeat(w)).join(" | ") + " |\n";

            // Body
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                const cells = [];
                for (let j = 0; j < colCount; j++) {
                    cells.push((row[j] || "").padEnd(colWidths[j]));
                }
                output += "| " + cells.join(" | ") + " |\n";
            }

            return output;
        }

        function generateHTML(data) {
            if (data.length === 0) return "";
            let html = "<table>\n";

            // Header
            if (data.length > 0) {
                html += "  <thead>\n    <tr>\n";
                data[0].forEach(cell => {
                    html += `      <th>${escapeHtml(cell)}</th>\n`;
                });
                html += "    </tr>\n  </thead>\n";
            }

            // Body
            if (data.length > 1) {
                html += "  <tbody>\n";
                for (let i = 1; i < data.length; i++) {
                    html += "    <tr>\n";
                    data[i].forEach(cell => {
                        html += `      <td>${escapeHtml(cell)}</td>\n`;
                    });
                    html += "    </tr>\n";
                }
                html += "  </tbody>\n";
            }

            html += "</table>";
            return html;
        }

        function generateASCII(data) {
            if (data.length === 0) return "";

            const colCount = data.reduce((max, row) => Math.max(max, row.length), 0);
            const colWidths = new Array(colCount).fill(0);

            for (let row of data) {
                for (let i = 0; i < colCount; i++) {
                    colWidths[i] = Math.max(colWidths[i], (row[i] || "").length);
                }
            }

            const separator = "+" + colWidths.map(w => "-".repeat(w + 2)).join("+") + "+\n";
            let output = separator;

            data.forEach((row, rowIndex) => {
                const cells = [];
                for (let i = 0; i < colCount; i++) {
                    cells.push((row[i] || "").padEnd(colWidths[i]));
                }
                output += "| " + cells.join(" | ") + " |\n";
                if (rowIndex === 0 || rowIndex === data.length - 1) {
                    output += separator;
                } else {
                    // For inner rows, we can just use simple separator or nothing?
                    // Standard MySQL puts separator between header and body, and at ends.
                    // Let's just put separator between header and body.
                }
            });

            // If more than header, close the table
            // Actually simplest ASCII table is:
            // +---+
            // | H |
            // +---+
            // | B |
            // +---+

            // Let's redo: Separator line, Row, Separator line...
            output = separator;
            data.forEach((row, rowIndex) => {
                const cells = [];
                for (let i = 0; i < colCount; i++) {
                    cells.push((row[i] || "").padEnd(colWidths[i]));
                }
                output += "| " + cells.join(" | ") + " |\n";
                output += separator;
            });

            return output;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function convert() {
            clearError();
            const input = leftPane.value;
            const inFormat = leftFormatSel.value;
            const outFormat = rightFormatSel.value;

            try {
                const data = parse(input, inFormat);
                const output = (() => {
                    switch (outFormat) {
                        case 'csv': return generateCSV(data);
                        case 'tsv': return generateTSV(data);
                        case 'markdown': return generateMarkdown(data);
                        case 'html': return generateHTML(data);
                        case 'ascii': return generateASCII(data);
                        default: return "";
                    }
                })();
                rightPane.value = output;
            } catch (e) {
                showError(e.message);
                // Don't clear output on error, maybe user wants to see partial?
                // Or maybe clear it? Let's just leave it or clear it.
                // rightPane.value = ""; 
            }
        }

        // --- Events ---

        leftPane.addEventListener('input', convert);
        leftFormatSel.addEventListener('change', convert);
        rightFormatSel.addEventListener('change', convert);

        swapBtn.addEventListener('click', () => {
            // Swap Formats
            const tempFmt = leftFormatSel.value;
            leftFormatSel.value = rightFormatSel.value;
            rightFormatSel.value = tempFmt;

            // Swap Content
            // Since right pane is output, it might be perfect to just move it to left.
            // But if there was an error, right pane might be empty or stale.
            // Let's take the current right pane value (which is a valid generation of the current left input)
            // and put it in the left pane.

            // However, if the user manually edited the right pane (if it was editable), we would want that.
            // But right pane is readonly.
            // So we take the generated content.

            const currentOutput = rightPane.value;
            leftPane.value = currentOutput;

            // Trigger convert to generate the new output (which effectively reverses the operation)
            // e.g. CSV -(convert)-> MD. Swap. MD -(convert)-> CSV.
            convert();
        });

        // Initial placeholder logic or default data
        leftPane.value = "Name\tAge\tLocation\nAlice\t30\tNew York\nBob\t25\tSan Francisco";
        convert();

    </script>

</body>

</html>
